name: Compilar y probar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Keystore de depuración (solo para firmar el APK de prueba)
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Lint, pruebas y APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

      - name: Subir APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marea-club-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir informes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/
            app/build/test-results/
