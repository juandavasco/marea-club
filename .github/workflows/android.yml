name: Compilar y probar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clave de firma fija (para que cada versión se instale encima de la anterior)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "Usando la clave fija guardada en el secreto DEBUG_KEYSTORE_BASE64"
          else
            echo "::warning::Falta el secreto DEBUG_KEYSTORE_BASE64. Se usa una clave temporal: este APK NO se podrá instalar encima de otras versiones."
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Lint, pruebas y APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

      - name: Subir APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marea-club-v${{ github.run_number }}-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar capturas de pantalla en la rama screenshots
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ -d app/build/screenshots ] && [ -n "$(ls -A app/build/screenshots)" ]; then
            mkdir -p /tmp/shots && cp app/build/screenshots/*.png /tmp/shots/
            cd /tmp/shots
            git init -q -b screenshots
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            echo "Capturas de la compilación #${{ github.run_number }} (${{ github.sha }})" > README.md
            git add -A && git commit -q -m "Capturas #${{ github.run_number }}"
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
          fi

      - name: Subir informes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/
            app/build/test-results/
